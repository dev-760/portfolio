<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <style>
    .brand-text { fill: #0F172A; }
    @media (prefers-color-scheme: dark) {
      .brand-text { fill: #FFFFFF; }
    }
  </style>

  <!-- Icon based on public/icon.svg -->
  <g transform="translate(42, 40) scale(0.2)">
    <!-- Outer Diamond -->
    <polygon points="0,-160 160,0 0,160 -160,0" fill="#0047FF" />

    <!-- Inner Triangle Cutout -->
    <polygon points="0,-88 78,6 -78,6" fill="#ffffff" />
  </g>

  <!-- Brand Typography in Times New Roman -->
  <text 
    class="brand-text"
    x="86" 
    y="52" 
    font-family="'Times New Roman', Times, 'Liberation Serif', serif" 
    font-size="40" 
    font-weight="700" 
    letter-spacing="-0.2">Hassan Karasu</text>
</svg>
